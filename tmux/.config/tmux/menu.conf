# ─────────────────────────────────────────────
# Command palette
# ─────────────────────────────────────────────

bind    p     display-popup -E -w 70% -h 50% -b rounded ~/.config/tmux/bin/palette.sh   # fzf command palette

# ─────────────────────────────────────────────
# Apps menu (M-p)
# One file per item in menu/: label = file name, hotkey = first letter,
# item = popup in the current directory running that script.
# ─────────────────────────────────────────────

run-shell "~/.config/tmux/bin/apps-menu.sh"
