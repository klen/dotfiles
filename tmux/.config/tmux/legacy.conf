# ─────────────────────────────────────────────
# Minimal config for tmux < 3.1 (RHEL 8 ships 2.7)
# ─────────────────────────────────────────────
# Loaded via ~/.tmux.conf, because these versions never read
# ~/.config/tmux/tmux.conf. No popups, menus, extended keys or
# other options newer tmux added.

# ─────────────────────────────────────────────
# General behaviour & performance
# ─────────────────────────────────────────────

set -g mouse on                                   # enable mouse support (scroll, select, resize)
set -g detach-on-destroy off                      # switch to another session when the current session is destroyed
set -g history-limit 100000                       # scrollback buffer size (default is 2,000)
set -g repeat-time 1000                           # increase repeat timeout for bound keys

set -sg escape-time 0                             # faster command sequences (no delay after Esc)
set -sg focus-events on                           # forward focus events to applications (e.g. Vim)
set -sg set-clipboard on                          # integrate with system clipboard

# ─────────────────────────────────────────────
# Windows, panes, display
# ─────────────────────────────────────────────

set -g base-index 1                               # start window numbering at 1 instead of 0
set -g renumber-windows on                        # renumber remaining windows after one is closed
set -wg mode-keys vi                              # vi-style key bindings in copy mode
set -wg automatic-rename on                       # auto-rename window to the current program
set -wg automatic-rename-format "#{pane_current_path}" # no b: modifier before 2.9
set -wg pane-base-index 1                         # start pane numbering at 1 (consistent with windows)

set -g set-titles on                              # update the host terminal title
set -g display-time 1000                          # how long status messages stay visible (ms)
set -g display-panes-time 800                     # how long pane numbers stay visible (ms)

# ─────────────────────────────────────────────
# Prefix
# ─────────────────────────────────────────────

unbind C-b              # remove default prefix
set -g prefix C-a       # use backtick as prefix key
bind C-a send-prefix    # press prefix twice to send literal backtick

# ─────────────────────────────────────────────
# Tmux control
# ─────────────────────────────────────────────

bind :        command-prompt                                # enter tmux command line
bind r        command-prompt "rename-window %%"             # rename current window
bind R        command-prompt "rename-session %%"            # rename current session
bind -n M-r   source-file ~/.config/tmux/legacy.conf \; display-message "Reload config"

# ─────────────────────────────────────────────
# Sessions
# ─────────────────────────────────────────────

bind    d     detach                                         # detach from current session
bind    S     choose-session                                 # interactive session chooser
bind -n M-s   choose-session                                 # same, but without prefix
bind -n M-n   command-prompt -p "New session:" "new-session -A -s '%%'"  # create / attach session
bind    K     run-shell "~/.config/tmux/bin/kill-clean.sh #{session_name}"     # kill session and clean up

# ─────────────────────────────────────────────
# Windows
# ─────────────────────────────────────────────

bind    X     kill-window                                    # close current window
bind    t     new-window -c "#{pane_current_path}"           # new window in current directory
bind -n M-t   new-window -c "#{pane_current_path}"           # same, but without prefix
bind -n M-1   select-window -t 1
bind -n M-2   select-window -t 2
bind -n M-3   select-window -t 3
bind -n M-4   select-window -t 4
bind -n M-5   select-window -t 5
bind -n M-6   select-window -t 6
bind -n M-7   select-window -t 7
bind -n M-8   select-window -t 8
bind -n M-9   select-window -t 9
bind    w     list-windows                                   # show window list
bind -n 'M-{' swap-window -t -1\; select-window -t -1        # move window left  (no prefix)
bind -n 'M-}' swap-window -t +1\; select-window -t +1        # move window right (no prefix)

# ─────────────────────────────────────────────
# Splits
# ─────────────────────────────────────────────

bind    s     split-window -v -c "#{pane_current_path}"      # horizontal split (below)
bind    v     split-window -h -c "#{pane_current_path}"      # vertical split (right)
bind -n M-D   split-window -v -c "#{pane_current_path}"      # horizontal split without prefix
bind -n M-d   split-window -h -c "#{pane_current_path}"      # vertical split without prefix
unbind '"'
unbind %

# ─────────────────────────────────────────────
# Panes
# ─────────────────────────────────────────────

bind    x     kill-pane                                     # close current pane
bind -n M-x   kill-pane                                     # same, but without prefix
bind    b     break-pane                                    # break pane to new window
bind    h     select-pane -L                                # move left
bind    j     select-pane -D                                # move down
bind    k     select-pane -U                                # move up
bind    l     select-pane -R                                # move right
bind    P     set pane-border-status                        # toggle per-pane title border

# ─────────────────────────────────────────────
# Smart pane navigation (Vim / tmux integration)
# ─────────────────────────────────────────────
# Inner if-shell is quoted, not { }: tmux < 3.0 cannot parse braces.

is_vim="~/.config/tmux/bin/is-vim #{pane_tty}"

bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h' 'if-shell -F "#{pane_at_left}" "" "select-pane -L"'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j' 'if-shell -F "#{pane_at_bottom}" "" "select-pane -D"'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k' 'if-shell -F "#{pane_at_top}" "" "select-pane -U"'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l' 'if-shell -F "#{pane_at_right}" "" "select-pane -R"'

bind-key -T copy-mode-vi 'C-h' if-shell -F '#{pane_at_left}' '' 'select-pane -L'
bind-key -T copy-mode-vi 'C-j' if-shell -F '#{pane_at_bottom}' '' 'select-pane -D'
bind-key -T copy-mode-vi 'C-k' if-shell -F '#{pane_at_top}' '' 'select-pane -U'
bind-key -T copy-mode-vi 'C-l' if-shell -F '#{pane_at_right}' '' 'select-pane -R'

# ─────────────────────────────────────────────
# Resize panes & layouts
# ─────────────────────────────────────────────

bind z        resize-pane -Z\; refresh-client -S  # toggle zoom for current pane
bind -n 'M-z' resize-pane -Z\; refresh-client -S  # same without prefix
bind -n 'M-h' if-shell "$is_vim" 'send-keys M-h' 'resize-pane -L 3'  # grow/shrink (respecting Vim)
bind -n 'M-j' if-shell "$is_vim" 'send-keys M-j' 'resize-pane -D 3'
bind -n 'M-k' if-shell "$is_vim" 'send-keys M-k' 'resize-pane -U 3'
bind -n 'M-l' if-shell "$is_vim" 'send-keys M-l' 'resize-pane -R 3'

bind -n 'M-=' if-shell "$is_vim" 'send-keys M-=' 'next-layout'  # cycle through pane layouts

# ─────────────────────────────────────────────
# Copy mode (vi-style)
# ─────────────────────────────────────────────

bind [ copy-mode
bind / copy-mode \; send-keys ?
bind -T copy-mode-vi 'v'   send -X begin-selection           # start visual selection
bind -T copy-mode-vi 'V'   send -X select-line               # select whole line
bind -T copy-mode-vi 'C-v' send -X rectangle-toggle          # toggle block selection
bind -T copy-mode-vi 'y'   send -X copy-selection-and-cancel   # yank to clipboard and exit

# ─────────────────────────────────────────────
# Status bar (same look as the main config)
# ─────────────────────────────────────────────
# colour250 instead of grey: 2.7 has no bare grey.

if-shell "[ -n \"$SSH_TTY\" ]" "set -g status-position bottom" "set -g status-position top"
set -g status-interval 10
set -g status-fg white
if-shell "[ -n \"$SSH_TTY\" ]" "set -g status-bg colour24" "set -g status-bg colour235"

setw -g window-status-separator ''
setw -g window-status-style 'bg=default,fg=colour250'
setw -g window-status-format '  #I:#W #F '

setw -g window-status-current-style 'bg=default,fg=white,bold'
setw -g window-status-current-format '  #I:#W #F '

set -g status-left-length 30
set -g status-left "#[fg=colour250,bold]#{?client_prefix,#[fg=colour231]#[bg=colour04] prefix ,#{?pane_in_mode,#[default]#[fg=default]#[bg=yellow] copy ,#{?synchronize-panes,#[default]#[fg=default]#[bg=yellow] sync ,#[default]#[fg=default]#[bg=default]}}}#[default] #S #[default]"

set -g status-right-length 100
set -g status-right '#[fg=colour250]#(~/.config/tmux/bin/git.sh #{pane_current_path})#(~/.config/tmux/bin/sysinfo.sh) | #(~/.config/tmux/bin/ssh-host.sh)'
