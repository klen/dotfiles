# ─────────────────────────────────────────────
# Panes
# ─────────────────────────────────────────────

set -wg pane-border-indicators off               # the pane bar is the only active-pane cue
set -wg pane-border-style 'fg=#2a2a2a'            # inactive pane frame
set -wg pane-active-border-style 'fg=#4a5a73'     # colours the whole active frame, bar row included

# Pane header only when a window is split, so single-pane windows keep their last row
set -wg pane-border-format '#[fg=#{?pane_active,#7E9CD8,#5c5c5c}] #{pane_index} #{pane_current_command} '
set -wg pane-border-status off
set-hook -g after-split-window 'set -w pane-border-status bottom'
set-hook -g after-kill-pane 'if -F "#{==:#{window_panes},1}" "set -w pane-border-status off"'

# Dim the text of every pane except the active one (only affects default-coloured text)
set -wg window-style 'dim'
set -wg window-active-style 'default'

# ─────────────────────────────────────────────
# Copy mode
# ─────────────────────────────────────────────

set -wg mode-style 'fg=#1F1F28,bg=#7E9CD8'        # copy mode highlight colour
%if "#{>=:#{version},3.4}"                          # menu styles, 3.4+
setw -g menu-selected-style 'fg=#1F1F28,bg=#7E9CD8'  # menu highlight, same as session chooser
setw -g menu-style 'default'                          # no menu background
setw -g menu-border-style 'default'
%endif
%if "#{>=:#{version},3.3}"                          # popup styles, 3.3+
setw -g popup-style 'bg=default,fg=#C7C7C7'           # popups use terminal bg, not grey
setw -g popup-border-style 'bg=default'
%endif

# ─────────────────────────────────────────────
# Notifications
# ─────────────────────────────────────────────

set -wg window-status-bell-style 'fg=#ff6c6b,bg=#1f1f28,bright'  # style for windows with bell

# ─────────────────────────────────────────────
# Status bar position & refresh
# ─────────────────────────────────────────────

# Top bar locally, bottom bar when inside SSH
if-shell "[ -n \"$SSH_TTY\" ]" "set -g status-position bottom" "set -g status-position top"
set -g status-interval 10    # redraw status line every 10 seconds


# ─────────────────────────────────────────────
# Colours
# ─────────────────────────────────────────────

# Prefer dark theme
%if "#{>=:#{version},3.8}"
set -g theme terminal
%endif

set -g status-fg white
# Darker background locally, slightly brighter when inside SSH
if-shell "[ -n \"$SSH_TTY\" ]" "set -g status-bg colour24" "set -g status-bg colour235"


# ─────────────────────────────────────────────
# Window list in status bar
# ─────────────────────────────────────────────

setw -g window-status-separator ''
setw -g window-status-style 'bg=default,fg=grey'
setw -g window-status-format '  #I:#W #F '

setw -g window-status-current-style 'bg=default,fg=white,bold'
setw -g window-status-current-format '  #I:#W #F '


# ─────────────────────────────────────────────
# Left status (session name + prefix indicator)
# ─────────────────────────────────────────────

set -g status-left-length 30
set -g status-left "#[fg=grey,bold]#{?client_prefix,#[fg=colour231]#[bg=colour04] prefix ,#{?pane_in_mode,#[default]#[fg=default]#[bg=yellow] copy ,#{?synchronize-panes,#[default]#[fg=default]#[bg=yellow] sync ,#[default]#[fg=default]#[bg=default]}}}#[default] #S #[default]"


# ─────────────────────────────────────────────
# Right status (git + sysinfo + remote host only)
# ─────────────────────────────────────────────

set -g status-right-length 100
set -g status-right '#[fg=grey]#(~/.config/tmux/bin/git.sh #{pane_current_path})#(~/.config/tmux/bin/sysinfo.sh)#(~/.config/tmux/bin/ssh-host.sh)'
