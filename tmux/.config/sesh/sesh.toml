#:schema https://github.com/joshmedeski/sesh/raw/main/sesh.schema.json

blacklist = ["scratch"]

[default_session]
startup_command = "ls -la"
preview_command = "~/.config/sesh/preview.sh {}"

[[session]]
name = "bash"
path = "~/dotfiles/bash/.config/bash"
startup_command = "nvim bashrc"

[[session]]
name = "ghostty"
path = "~/dotfiles/ghostty/.config/ghostty"
startup_command = "nvim config"

[[session]]
name = "nvim"
path = "~/dotfiles/nvim/.config/nvim"
startup_command = "nvim init.lua"

[[session]]
name = "tmux"
path = "~/dotfiles/tmux/.config/tmux"
startup_command = "nvim tmux.conf"

[[session]]
name = "sesh"
path = "~/dotfiles/tmux/.config/sesh"
startup_command = "nvim sesh.toml"

[[session]]
name = "agents"
path = "~/dotfiles/agents/.config/agents"

[[session]]
name = "tc"
path = "~/projects/ticketscloud.org/deploy"

[[session]]
name = "team-tracker"
path = "~/projects/team-tracker"
windows = ["tt-api", "tt-web", "tt-devops"]

[[session]]
name = "pyradio"
startup_command = "pyradio"
path = "~/dotfiles/common/.config/pyradio"

# Projects

## TicketsCloud

[[window]]
name = "tc-devops"
path = "~/projects/ticketscloud.org/deploy"

## Team Tracker

[[window]]
name = "tt-api"
path = "~/projects/team-tracker/api"

[[window]]
name = "tt-web"
path = "~/projects/team-tracker/web"

[[window]]
name = "tt-devops"
path = "~/projects/team-tracker/devops"

## Vibeapp

[[session]]
name = "vibe"
path = "~/projects/ticketscloud.org/vibe-api"
windows = ["vb-devops"]

[[window]]
name = "vb-devops"
path = "~/projects/ticketscloud.org/vibe-devops"
